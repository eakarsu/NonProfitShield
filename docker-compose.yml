version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: insurance_platform
      POSTGRES_USER: insurance_user
      POSTGRES_PASSWORD: insurance_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance_user -d insurance_platform"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://insurance_user:insurance_password@postgres:5432/insurance_platform
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=insurance_user
      - PGPASSWORD=insurance_password
      - PGDATABASE=insurance_platform
      - SESSION_SECRET=your-secure-session-secret-here
      - REPL_ID=insurance-platform
      - REPLIT_DOMAINS=localhost
      - ISSUER_URL=https://replit.com/oidc
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  uploads: